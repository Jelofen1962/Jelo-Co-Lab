name: Build and publish Jelo Co-Lab

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-version:
    name: Prepare and verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align both packages and lockfile roots to the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.cjs
      - name: Verify exact versions and refresh npm integrity metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.cjs

  extension-host-platforms:
    needs: verify-release-version
    name: Extension Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            vscode-extension/package-lock.json
      - name: Align both packages to the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.cjs
      - name: Verify release metadata and refresh npm integrity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.cjs
      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci
      - name: Audit extension production dependencies
        working-directory: vscode-extension
        run: npm audit --omit=dev --audit-level=high
      - name: Install VS Code test harness
        working-directory: vscode-extension
        run: npm install --no-save --package-lock=false @vscode/test-electron@2.5.2
      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile
      - name: Validate Extension Host test entry point
        working-directory: vscode-extension
        run: node --check test/runTest.js && node --check test/suite/index.js
      - name: Run Extension Host tests on Ubuntu
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm test
      - name: Run Extension Host tests on Windows
        if: runner.os == 'Windows'
        working-directory: vscode-extension
        run: npm test

  test-and-release:
    needs: [verify-release-version, extension-host-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            vscode-extension/package-lock.json
      - name: Align both packages to the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-release.cjs
      - name: Verify release metadata and refresh official npm integrity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-version.cjs
      - name: Install, test, and audit server
        working-directory: server
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Compile, audit, and package VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          # Keep devDependencies (especially TypeScript) installed while VSCE
          # runs vscode:prepublish, which invokes tsc. Do not prune before VSCE.
          test -x node_modules/.bin/tsc
          npm run compile
          test -s out/extension.js
          cp ../LICENSE LICENSE
          npx --yes @vscode/vsce package --out "jelofen-co-lab-${GITHUB_REF_NAME}.vsix"
          test -s "jelofen-co-lab-${GITHUB_REF_NAME}.vsix"
          unzip -Z1 "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" | grep -qx 'extension/node_modules/ws/package.json'
          if ! unzip -Z1 "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" | grep -qx 'extension/LICENSE.txt'; then
            echo 'Expected extension/LICENSE.txt in VSIX. Found license entries:' >&2
            unzip -Z1 "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" | grep -i 'license' >&2 || true
            exit 1
          fi
          # VSCE must include production dependencies but not TypeScript dev tooling.
          if unzip -Z1 "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" | grep -q '^extension/node_modules/typescript/'; then
            echo 'TypeScript devDependency leaked into VSIX' >&2
            exit 1
          fi
          unzip -p "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" extension/package.json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s); if (p.version !== process.env.GITHUB_REF_NAME.replace(/^v/, "") || p.dependencies?.ws !== "8.22.1" || p.license !== "MIT") process.exit(1);});'
      - name: Package server and checksums
        run: |
          mkdir -p dist/server/scripts
          cp server/index.js server/security.js server/ot.js server/access.js server/manage-access.js server/manager.js server/package.json server/package-lock.json server/README.md dist/server/
          cp -R server/tests dist/server/tests
          cp scripts/install-server.sh scripts/backup-server.sh scripts/restore-server.sh scripts/configure-caddy.sh scripts/install-backup-timer.sh scripts/server-manager.sh scripts/server-setup.sh scripts/refresh-ws-lockfile.cjs dist/server/scripts/
          cp LICENSE SECURITY.md dist/server/
          chmod +x dist/server/scripts/*.sh
          node --check dist/server/manager.js
          bash -n dist/server/scripts/*.sh
          (cd dist && zip -X -r "jelo-colab-server-${GITHUB_REF_NAME}.zip" server)
          unzip -t "dist/jelo-colab-server-${GITHUB_REF_NAME}.zip"
          sha256sum "dist/jelo-colab-server-${GITHUB_REF_NAME}.zip" > "dist/jelo-colab-server-${GITHUB_REF_NAME}.zip.sha256"
          sha256sum "vscode-extension/jelofen-co-lab-${GITHUB_REF_NAME}.vsix" > "vscode-extension/jelofen-co-lab-${GITHUB_REF_NAME}.vsix.sha256"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            vscode-extension/jelofen-co-lab-${{ github.ref_name }}.vsix
            dist/jelo-colab-server-${{ github.ref_name }}.zip
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            vscode-extension/jelofen-co-lab-${{ github.ref_name }}.vsix
            vscode-extension/jelofen-co-lab-${{ github.ref_name }}.vsix.sha256
            dist/jelo-colab-server-${{ github.ref_name }}.zip
            dist/jelo-colab-server-${{ github.ref_name }}.zip.sha256
