name: Build and publish Jelo Co-Lab

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-version:
    name: Verify release tag and package versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh server lockfile metadata
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh extension lockfile metadata
        working-directory: vscode-extension
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify tag, manifests, lockfile roots, and patched ws
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = String(process.env.RELEASE_TAG || '').replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(expected)) {
            console.error(`Invalid release tag: ${process.env.RELEASE_TAG || '(empty)'}`);
            process.exit(2);
          }
          let failed = false;
          for (const dir of ['server', 'vscode-extension']) {
            const manifest = JSON.parse(fs.readFileSync(`${dir}/package.json`, 'utf8'));
            const lock = JSON.parse(fs.readFileSync(`${dir}/package-lock.json`, 'utf8'));
            const lockedWs = lock.packages?.['node_modules/ws'];
            const errors = [];
            if (manifest.version !== expected) errors.push(`package.json version ${manifest.version} != ${expected}`);
            if (lock.version !== expected) errors.push(`package-lock version ${lock.version} != ${expected}`);
            if (lock.packages?.['']?.version !== expected) errors.push(`package-lock root version ${lock.packages?.['']?.version} != ${expected}`);
            if (manifest.dependencies?.ws !== '8.22.1') errors.push(`package.json ws must be 8.22.1 (found ${manifest.dependencies?.ws})`);
            if (lockedWs?.version !== '8.22.1' || !lockedWs.integrity) errors.push(`lockfile ws must resolve to 8.22.1 with integrity metadata (found ${lockedWs?.version || 'missing'})`);
            if (errors.length) {
              failed = true;
              console.error(`${dir}: ${errors.join('; ')}`);
            } else {
              console.log(`${dir}: version ${expected}; ws ${lockedWs.version} with integrity metadata`);
            }
          }
          if (failed) process.exit(1);
          NODE

  extension-host-platforms:
    needs: verify-release-version
    name: Extension Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Refresh and verify extension lockfile metadata
        working-directory: vscode-extension
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e 'const p=require("./package-lock.json").packages["node_modules/ws"]; const [a,b,c]=String(p?.version||"0.0.0").split(".").map(Number); if (p?.version !== "8.22.1" || !p.integrity) { console.error("Expected ws 8.22.1 with registry integrity metadata"); process.exit(1); }'
          npm ci

      - name: Audit extension production dependencies
        working-directory: vscode-extension
        run: npm audit --omit=dev --audit-level=high

      - name: Install VS Code test harness
        working-directory: vscode-extension
        run: npm install --no-save --package-lock=false @vscode/test-electron@2.5.2

      - name: Compile extension
        working-directory: vscode-extension
        run: npm run compile

      - name: Validate Extension Host test entry point
        working-directory: vscode-extension
        run: node --check test/runTest.js && node --check test/suite/index.js

      - name: Run Extension Host tests (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm test

      - name: Run Extension Host tests (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode-extension
        run: npm test

  test-and-release:
    needs: [verify-release-version, extension-host-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            vscode-extension/package-lock.json

      - name: Install and test server
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e 'const p=require("./package-lock.json").packages["node_modules/ws"]; const [a,b,c]=String(p?.version||"0.0.0").split(".").map(Number); if (p?.version !== "8.22.1" || !p.integrity) { console.error("Expected ws 8.22.1 with registry integrity metadata"); process.exit(1); }'
          npm ci
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Compile and package VS Code extension
        working-directory: vscode-extension
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e 'const p=require("./package-lock.json").packages["node_modules/ws"]; const [a,b,c]=String(p?.version||"0.0.0").split(".").map(Number); if (p?.version !== "8.22.1" || !p.integrity) { console.error("Expected ws 8.22.1 with registry integrity metadata"); process.exit(1); }'
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run compile
          npm prune --omit=dev
          cp ../LICENSE LICENSE
          npx --yes @vscode/vsce package --out "jelofen-co-lab-${GITHUB_REF_NAME}.vsix"
          test -s "jelofen-co-lab-${GITHUB_REF_NAME}.vsix"
          unzip -Z1 "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" | grep -qx 'extension/node_modules/ws/package.json'
          unzip -Z1 "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" | grep -qx 'extension/LICENSE'
          unzip -p "jelofen-co-lab-${GITHUB_REF_NAME}.vsix" extension/package.json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s); if (!p.dependencies?.ws || p.license !== "MIT") process.exit(1);});'

      - name: Package server and checksums
        run: |
          mkdir -p dist/server/scripts
          cp server/index.js server/security.js server/ot.js server/access.js server/manage-access.js server/package.json server/package-lock.json server/README.md dist/server/
          cp -R server/tests dist/server/tests
          cp scripts/backup-server.sh scripts/restore-server.sh scripts/configure-caddy.sh scripts/install-backup-timer.sh dist/server/scripts/
          cp LICENSE SECURITY.md dist/server/
          chmod +x dist/server/scripts/*.sh
          (cd dist && zip -X -r "jelo-colab-server-${GITHUB_REF_NAME}.zip" server)
          unzip -t "dist/jelo-colab-server-${GITHUB_REF_NAME}.zip"
          sha256sum "dist/jelo-colab-server-${GITHUB_REF_NAME}.zip" > "dist/jelo-colab-server-${GITHUB_REF_NAME}.zip.sha256"
          sha256sum "vscode-extension/jelofen-co-lab-${GITHUB_REF_NAME}.vsix" > "vscode-extension/jelofen-co-lab-${GITHUB_REF_NAME}.vsix.sha256"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            vscode-extension/jelofen-co-lab-${{ github.ref_name }}.vsix
            dist/jelo-colab-server-${{ github.ref_name }}.zip

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            vscode-extension/jelofen-co-lab-${{ github.ref_name }}.vsix
            vscode-extension/jelofen-co-lab-${{ github.ref_name }}.vsix.sha256
            dist/jelo-colab-server-${{ github.ref_name }}.zip
            dist/jelo-colab-server-${{ github.ref_name }}.zip.sha256
